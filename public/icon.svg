<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f3d91"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dark highway slate background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Highway Horizon & Black Road -->
  <path d="M96 424 L182 324 L330 324 L416 424 Z" fill="#0d0f12"/>
  <rect x="251" y="338" width="10" height="24" rx="3" fill="#facc15"/>
  <rect x="250" y="378" width="12" height="30" rx="3" fill="#facc15"/>

  <!-- AC Roof Pod -->
  <rect x="176" y="92" width="160" height="28" rx="12" fill="#f8fafc"/>
  <rect x="200" y="101" width="112" height="10" rx="5" fill="#f97316"/>

  <!-- Luxury Coach Body -->
  <rect x="136" y="114" width="240" height="232" rx="28" fill="url(#coach)" stroke="#f8fafc" stroke-width="5"/>

  <!-- Side Mirrors -->
  <rect x="114" y="168" width="22" height="44" rx="6" fill="#0f3d91" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="376" y="168" width="22" height="44" rx="6" fill="#0f3d91" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Panoramic Windshield + Destination LED Header -->
  <rect x="154" y="132" width="204" height="116" rx="14" fill="url(#glass)" stroke="#94a3b8" stroke-width="4"/>
  <rect x="172" y="138" width="168" height="20" rx="5" fill="#0b1322"/>
  <rect x="184" y="144" width="144" height="8" rx="4" fill="#fbbf24"/>

  <!-- Livery Accent Band -->
  <rect x="138" y="258" width="236" height="18" fill="#f97316"/>
  <rect x="138" y="276" width="236" height="7" fill="#facc15"/>

  <!-- Chrome Grille & Twin Headlights -->
  <rect x="210" y="294" width="92" height="26" rx="6" fill="#cbd5e1"/>
  <rect x="218" y="300" width="76" height="4" rx="2" fill="#334155"/>
  <rect x="218" y="309" width="76" height="4" rx="2" fill="#334155"/>

  <rect x="152" y="295" width="44" height="22" rx="6" fill="#fef08a" stroke="#facc15" stroke-width="3"/>
  <rect x="316" y="295" width="44" height="22" rx="6" fill="#fef08a" stroke="#facc15" stroke-width="3"/>

  <!-- Wheels -->
  <rect x="156" y="344" width="38" height="26" rx="7" fill="#111827"/>
  <rect x="318" y="344" width="38" height="26" rx="7" fill="#111827"/>
</svg>
